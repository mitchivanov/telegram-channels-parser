version: '3.8'

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      # Retention policy - настраивается через переменную окружения
      - KAFKA_CFG_LOG_RETENTION_MS=${MODERATION_TTL_MS:-3600000}  # По умолчанию 60 минут
      - KAFKA_CFG_LOG_SEGMENT_MS=${MODERATION_TTL_SEGMENT_MS:-1800000}  # По умолчанию 30 минут
      - KAFKA_CFG_LOG_CLEANUP_INTERVAL_MS=300000  # проверка каждые 5 минут
    # ports:  # Removed external port exposure
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: "2.0"
    mem_limit: 2g
    logging: *default-logging

  redis:
    image: redis:7
    container_name: redis
    # ports:  # Removed external port exposure
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  parser:
    build: ./parser
    container_name: parser
    volumes:
      - parser_session:/app/session
      - parser_temp:/app/temp
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - TELEGRAM_CONFIG=/app/config/telegram_config.json
      - KAFKA_CONFIG=/app/config/kafka_config.json
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    logging: *default-logging

  google-sheets-sync:
    build:
      context: ./parser
      dockerfile: Dockerfile.sync
    container_name: google-sheets-sync
    volumes:
      - parser_session:/app/session
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PG_DSN=postgresql://postgres:postgres@db:5432/filter
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
      - GOOGLE_CREDENTIALS_FILE=/app/credentials.json
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME:-Sheet1}
      - GOOGLE_COLUMN=${GOOGLE_COLUMN:-1}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-5}
      - TELEGRAM_CONFIG=/app/config/telegram_config.json
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  notifications-bot:
    build: ./notifications-bot
    container_name: notifications-bot
    depends_on:
      redis:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CODE_BOT_TOKEN=${CODE_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  filter-backend:
    build:
      context: ./filter
      dockerfile: Dockerfile
    container_name: filter-backend
    env_file:
      - ./filter/.env
    environment:
      - CHANNEL1_ID=${CHANNEL1_ID}
      - CHANNEL2_ID=${CHANNEL2_ID}
      - CHANNEL3_ID=${CHANNEL3_ID}
      - MODERATION_TTL_MINUTES=${MODERATION_TTL_MINUTES:-60}
    ports:
      - "127.0.0.1:8005:8000"  # Changed to localhost-only
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./filter:/app
      - parser_temp:/app/temp
    cpus: "1.0"
    mem_limit: 1g
    logging: *default-logging

  filter-worker:
    build:
      context: ./filter
      dockerfile: Dockerfile
    container_name: filter-worker
    env_file:
      - ./filter/.env
    environment:
      - CHANNEL1_ID=${CHANNEL1_ID}
      - CHANNEL2_ID=${CHANNEL2_ID}
      - CHANNEL3_ID=${CHANNEL3_ID}
      - MODERATION_TTL_MINUTES=${MODERATION_TTL_MINUTES:-60}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    command: python kafka_worker.py
    volumes:
      - ./filter:/app
      - parser_temp:/app/temp
    cpus: "1.0"
    mem_limit: 1g
    logging: *default-logging

  filter-frontend:
    build:
      context: ./filter/frontend
      dockerfile: Dockerfile
    container_name: filter-frontend
    ports:
      - "8085:80"
    depends_on:
      filter-backend:
        condition: service_started
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  channels-bot:
    build:
      context: ./channels-bot
    container_name: channels-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPICS=channel1_posts,channel2_posts,channel3_posts
      - CHANNEL1_ID=${CHANNEL1_ID}
      - CHANNEL2_ID=${CHANNEL2_ID}
      - CHANNEL3_ID=${CHANNEL3_ID}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - parser_temp:/app/temp
    cpus: "1.0"
    mem_limit: 1g
    logging: *default-logging

  channels-cleanup-worker:
    build:
      context: ./channels-bot
    container_name: channels-cleanup-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    command: python -u cleanup_worker.py
    volumes:
      - parser_temp:/app/temp
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  db:
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=filter
    # ports:  # Removed external port exposure
    volumes:
      - db_data:/var/lib/postgresql/data
    cpus: "2"
    mem_limit: 2g
    logging: *default-logging
    restart: unless-stopped
    # Healthcheck для мониторинга состояния БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    restart: unless-stopped
    # ports:  # Removed external port exposure
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  # Monitoring stack - disabled for now
