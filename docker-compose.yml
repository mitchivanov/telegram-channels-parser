  #   volumes:
  #     - grafana_data:/var/lib/grafana

  filter-bot:
    build:
      context: ./filter-bot
      dockerfile: Dockerfile
    container_name: filter-bot
    env_file:
      - ./filter-bot/.env
    environment:
      - MODERATION_TTL_MINUTES=${MODERATION_TTL_MINUTES:-60}
      - MODERATION_EXPIRE_GRACE_SECONDS=${MODERATION_EXPIRE_GRACE_SECONDS}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - parser_temp:/app/temp
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

